[server]
# headless + 0.0.0.0 let a phone on the same Wi-Fi reach the local dev server.
# Streamlit Cloud supplies its own host/port and ignores this section.
headless = true
address = "0.0.0.0"
port = 8501

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#28683c"
backgroundColor = "#f3f7f0"
secondaryBackgroundColor = "#ffffff"
textColor = "#18352b"
font = "sans serif"
